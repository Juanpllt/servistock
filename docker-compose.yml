# Servistock completo: base de datos + aplicación (backend y frontend en una sola imagen).
#   Arrancar:              docker compose up -d --build
#   Con API Gateway Kong:  docker compose --profile gateway up -d --build
#   Detener:               docker compose down          (agrega -v para borrar también los datos)
# Las variables se leen del archivo .env de esta carpeta (copia .env.example y cámbialo).
name: servistock

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: servistock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: servistock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servistock -d servistock"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # La base no se publica en tu computador: solo la aplicación (red interna) puede llegar a ella

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://servistock:${POSTGRES_PASSWORD}@db:5432/servistock
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      TZ_NEGOCIO: ${TZ_NEGOCIO:-America/Bogota}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Auth0 (opcional): si están vacíos, el botón "Ingresar con Auth0" no aparece
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
    ports:
      - "${APP_PORT:-8080}:3000"
    restart: unless-stopped

  # API Gateway opcional (perfil "gateway"): http://localhost:8100 -> Kong -> aplicación
  kong:
    profiles: [gateway]
    image: kong:3.7
    depends_on:
      - app
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.compose.yml:/kong/kong.yml:ro
    ports:
      - "${KONG_PORT:-8100}:8000"
    restart: unless-stopped

volumes:
  pgdata:
