# Configuración de SonarCloud. Cambia los dos primeros valores por los de tu cuenta:
#   - sonar.organization: la clave de tu organización en https://sonarcloud.io
#   - sonar.projectKey:   la clave que SonarCloud asigna al proyecto al importarlo desde GitHub
