<main class="contenedor">
  <form class="tarjeta" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">ServiStack</p>

    <label for="email">Correo electrónico</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="campo-error">Ingresa un correo válido</span>
    }

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <span class="campo-error">La contraseña es obligatoria</span>
    }

    @if (error()) {
      <div class="alerta" role="alert">{{ error() }}</div>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    @if (auth0.config()) {
      <div class="separador"><span>o</span></div>
      <button type="button" class="auth0" [disabled]="cargando()" (click)="ingresarConAuth0()">
        Ingresar con Auth0
      </button>
    }
  </form>
</main>
